services:
  - type: web
    name: clauseguard-backend
    env: python
    region: oregon
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ALGORAND_SENDER_MNEMONIC
        sync: false
      - key: ALGORAND_RECIPIENT_ADDRESS
        value: "ULDGSMHBVIIXNZO3W4H6GTHSYPCAFQ6SV5CWZGONABA22RLBLTI4LBFWAQ"
      - key: ALGORAND_ALGOD_SERVER
        value: "https://testnet-api.algonode.cloud"
